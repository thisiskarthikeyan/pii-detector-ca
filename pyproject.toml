[project]
name = "pii-detector-ca"
version = "0.1.0"
description = "Checksum-validated detectors for Canadian health and government identifiers (SIN, OHIP, RAMQ, BC PHN, Alberta ULI, postal codes, street addresses): standalone or as Microsoft Presidio recognizers, with a synthetic clinical-text benchmark"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Karthik", email = "blue1agave@gmail.com" }]
maintainers = [{ name = "Karthik", email = "blue1agave@gmail.com" }]
requires-python = ">=3.10"
keywords = ["presidio", "pii", "phi", "de-identification", "canada", "clinical-nlp", "health-card", "sin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "presidio-analyzer>=2.2",
]

[project.optional-dependencies]
benchmark = [
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pandas>=2.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/thisiskarthikeyan/pii-detector"
Repository = "https://github.com/thisiskarthikeyan/pii-detector"
Issues = "https://github.com/thisiskarthikeyan/pii-detector/issues"
Changelog = "https://github.com/thisiskarthikeyan/pii-detector/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_detector_ca"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src", "evaluation", "benchmark", "tests"]
mypy_path = "src:evaluation:benchmark"
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# presidio-analyzer / spacy ship no type stubs
ignore_missing_imports = true
