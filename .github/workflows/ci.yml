name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q

  standalone:
    # The base install must work with no dependencies (scan() is stdlib-only).
    name: Standalone install (no Presidio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          from pii_detector_ca import scan, get_recognizers
          hits = scan("SIN 130-692-544, card 1234 567 897")
          assert {h.entity for h in hits} == {"CA_SIN", "CA_OHIP"}, hits
          try:
              get_recognizers()
          except ImportError as e:
              assert "pii-detector-ca[presidio]" in str(e)
          else:
              raise SystemExit("expected ImportError without presidio")
          print("standalone OK")
          PY

  eval:
    # Locked environment: eval numbers must be reproducible, so this job
    # installs exactly uv.lock plus the pinned spaCy model (the test matrix
    # above intentionally uses loose resolution — that's what consumers get).
    name: Eval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: |
          uv sync --locked --extra dev
          uv pip install -r evaluation/requirements-eval.txt
      - name: Regenerate corpus from fixed seed
        run: |
          uv run --no-sync python benchmark/generate_corpus.py --n 1000
          uv run --no-sync python benchmark/generate_negatives.py --n 300
          uv run --no-sync python benchmark/generate_hard.py --per-cell 50
          uv run --no-sync python benchmark/generate_address_eval.py --n 300
      - name: Corpus determinism check
        run: uv run --no-sync python benchmark/check_determinism.py
      - name: Run evaluation
        run: uv run --no-sync python evaluation/run_eval.py --all
      - name: False-positive evaluation (negatives corpus)
        run: uv run --no-sync python evaluation/run_negatives.py
      - name: Adversarial hard-split evaluation
        run: uv run --no-sync python evaluation/run_hard.py
      - name: Street-address evaluation (ODA holdout)
        run: uv run --no-sync python evaluation/run_address_eval.py
      - name: Threshold gate
        run: uv run --no-sync python evaluation/check_thresholds.py
