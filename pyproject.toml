[project]
name = "presidio-recognizers-ca-in"
version = "0.1.0"
description = "Checksum-validated Microsoft Presidio recognizers for Canadian and Indian identifiers, with a synthetic clinical-text benchmark"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Karthik" }]
requires-python = ">=3.10"
keywords = ["presidio", "pii", "phi", "de-identification", "canada", "india", "clinical-nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "presidio-analyzer>=2.2",
]

[project.optional-dependencies]
benchmark = [
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/karthik/presidio-recognizers-ca-in"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_recognizers_ca_in"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
