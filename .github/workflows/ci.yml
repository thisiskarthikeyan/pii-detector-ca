name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q

  eval:
    # Locked environment: eval numbers must be reproducible, so this job
    # installs exactly uv.lock plus the pinned spaCy model (the test matrix
    # above intentionally uses loose resolution — that's what consumers get).
    name: Eval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: |
          uv sync --locked --extra dev
          uv pip install -r evaluation/requirements-eval.txt
      - name: Regenerate corpus from fixed seed
        run: |
          uv run --no-sync python benchmark/generate_corpus.py --locale ca --n 1000
          uv run --no-sync python benchmark/generate_corpus.py --locale in --n 1000
          uv run --no-sync python benchmark/generate_negatives.py --locale ca --n 300
          uv run --no-sync python benchmark/generate_hard.py --per-cell 10
      - name: Corpus determinism check
        run: uv run --no-sync python benchmark/check_determinism.py
      - name: Run evaluation
        run: uv run --no-sync python evaluation/run_eval.py --all
      - name: False-positive evaluation (negatives corpus)
        run: uv run --no-sync python evaluation/run_negatives.py
      - name: Adversarial hard-split evaluation
        run: uv run --no-sync python evaluation/run_hard.py
      - name: Threshold gate
        run: uv run --no-sync python evaluation/check_thresholds.py
